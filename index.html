<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>play — Aiden's project playground</title>
<meta name="description" content="An index of the projects in Aiden Cullo's play repo." />
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12161c;
    --panel-2: #171c24;
    --line: rgba(255,255,255,.07);
    --fg: #e6edf3;
    --muted: #8b98a9;
    --accent: #6ee7b7;
    --accent-2: #60a5fa;
    --pink: #f472b6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(96,165,250,.16), transparent 60%),
      radial-gradient(800px 460px at 88% 0%, rgba(110,231,183,.12), transparent 60%),
      var(--bg);
    color: var(--fg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 64px 24px 96px; }
  header { margin-bottom: 40px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 18px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  h1 {
    font-size: clamp(34px, 6vw, 56px);
    line-height: 1.02;
    letter-spacing: -.03em;
    margin: 0 0 16px;
    font-weight: 700;
  }
  h1 span {
    background: linear-gradient(100deg, var(--accent), var(--accent-2) 55%, var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lede { color: var(--muted); font-size: 17px; line-height: 1.6; max-width: 60ch; margin: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 32px 0 28px; }
  .search {
    flex: 1 1 260px; display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
  }
  .search svg { flex: none; opacity: .5; }
  .search input {
    flex: 1; background: none; border: 0; outline: none;
    color: var(--fg); font-size: 15px; font-family: inherit;
  }
  .search input::placeholder { color: #5d6a7a; }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px;
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    position: relative; overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
    opacity: 0; transition: opacity .16s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(110,231,183,.35); box-shadow: 0 14px 34px -18px rgba(0,0,0,.9); }
  .card:hover::after { opacity: 1; }
  .card h2 { font-size: 15.5px; margin: 0 0 6px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .card p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .tag {
    display: inline-block; margin-top: 12px; font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; display: none; }
  footer { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--accent-2); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  ::selection { background: rgba(110,231,183,.28); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span> play · project playground</div>
    <h1>A pile of things <span>I'm playing with.</span></h1>
    <p class="lede">
      Experiments, demos, half-finished ideas and the occasional finished one.
      Everything below lives in the <code>play</code> repo.
    </p>
  </header>

  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Filter projects…" autocomplete="off" aria-label="Filter projects" />
    </label>
    <div class="count"><span id="shown">0</span> projects</div>
  </div>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty">Nothing matches that.</p>

  <footer>
    <span>Built by Aiden Cullo · deployed on GitHub Pages</span>
    <a href="https://github.com/aidencullo">github.com/aidencullo</a>
  </footer>
</div>

<script>
  const projects = [
    ["restaurant-resume", "Software engineering resume, built as a single-page site.", "web"],
    ["yourclaw.lol", "One-click personal AI assistant, powered by OpenClaw.", "web"],
    ["opendocs", "RAG chatbot that answers questions from the OpenClaw docs.", "web"],
    ["lobsterboard", "Self-hosted drag-and-drop dashboard builder with live system monitoring.", "web"],
    ["ratemylandlord", "Rate and review landlords — Node server plus public frontend.", "web"],
    ["review-moderator", "Review moderation service with a small web UI.", "web"],
    ["typing.aidencullo.com", "Typing speed test site.", "web"],
    ["blog", "Jekyll-powered personal blog.", "web"],
    ["hugo-hello-world", "Static site built with Hugo.", "web"],
    ["evently", "Event landing page with its own CSS and JS.", "web"],
    ["trattoria-del-lupo", "Restaurant site for Trattoria del Lupo.", "web"],
    ["sample-restaurant", "Sample restaurant landing page.", "web"],
    ["here-now-site", "Compact personal site, published with here.now.", "web"],
    ["instant-site", "Tiny landing page published in one shot.", "web"],
    ["site", "Hello world static page.", "web"],
    ["random-site", "Randomly generated page with a live clock.", "web"],
    ["hello-world", "The obligatory first page.", "web"],

    ["openclaw", "Multi-channel AI gateway with extensible messaging integrations.", "ai"],
    ["openclaw-gateway", "Gateway service routing messages to agents, with Docker setup.", "ai"],
    ["basic-agent", "Minimal agent demo.", "ai"],
    ["activism-agent", "Volunteer outreach coordination for activist organizers.", "ai"],
    ["notion-project", "Notion-backed Python app.", "ai"],
    ["openrouter-chatbot", "Chatbot frontend wired up to OpenRouter.", "ai"],
    ["simple-mcp", "A minimal MCP server in Python.", "ai"],

    ["cloud-run-app", "Containerised Python service ready for Cloud Run.", "infra"],
    ["hello-lambda", "Hello-world Cloudflare Worker.", "infra"],
    ["tersebot", "Worker-powered bot with a static landing page.", "infra"],
    ["spring-boot-demo", "Minimal Spring Boot service.", "infra"],
    ["myproject", "Django project scaffold.", "infra"],
    ["db_explorer", "Elixir/Phoenix database explorer.", "infra"],
    ["grpc-demo", "Minimal Go gRPC hello-world (Greeter / SayHello).", "infra"],
    ["glue-etl-sample", "AWS Glue ETL job plus deploy script.", "infra"],
    ["gitlab-environments-demo", "GitLab environments and deploy pipeline demo.", "infra"],
    ["better-stack-test", "Python scratch project for Better Stack testing.", "infra"],
    ["concurrent_task_pool", "Elixir concurrent task pool.", "infra"],
    ["celery-demo", "Celery worker demo.", "infra"],
    ["tenants2", "JustFix tenant platform (fork).", "infra"],
    ["tenants2-fresh", "Second working copy of the JustFix tenant platform.", "infra"],

    ["game_of_life", "Conway's Game of Life compiled from Zig.", "systems"],
    ["zig-timer", "Timer written in Zig.", "systems"],
    ["zig-web", "Zig web experiments.", "systems"],
    ["selenium-play", "Java/Selenium browser automation playground.", "systems"],
    ["refactoring-csharp-aidencullo", "C# live-coding refactoring exercise.", "systems"],
    ["paperclip", "Documentation-heavy tooling project with a CLI and Docker setup.", "systems"],
    ["landlourd", "Rental app project.", "systems"],
    ["app", "Next.js app with a Python API and a financial dataset.", "systems"]
  ];

  const grid = document.getElementById('grid');
  const q = document.getElementById('q');
  const shown = document.getElementById('shown');
  const empty = document.getElementById('empty');

  function render(list) {
    grid.innerHTML = list.map(([name, desc, tag]) => `
      <a class="card" href="https://github.com/aidencullo?tab=repositories&q=${encodeURIComponent(name)}" target="_blank" rel="noopener">
        <h2>${name}</h2>
        <p>${desc}</p>
        <span class="tag">${tag}</span>
      </a>`).join('');
    shown.textContent = list.length;
    empty.style.display = list.length ? 'none' : 'block';
  }

  function filter() {
    const term = q.value.trim().toLowerCase();
    render(projects.filter(([n, d, t]) =>
      !term || (n + ' ' + d + ' ' + t).toLowerCase().includes(term)
    ));
  }

  q.addEventListener('input', filter);
  render(projects);
</script>
</body>
</html>
